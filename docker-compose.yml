services:
  # NGINX Load Balancer & Caching Proxy
  nginx-lb:
    image: nginx:alpine
    container_name: learncloud-loadbalancer
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - app-network

  # Backend Replica 1
  backend-1:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: learncloud-backend-1
    environment:
      - PORT=5000
      - MONGODB_URL=mongodb://mongo:27017/learncloud
      - JWT_SECRET=learncloud_jwt_secret_key_12345
    depends_on:
      - mongo
    networks:
      - app-network

  # Backend Replica 2
  backend-2:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: learncloud-backend-2
    environment:
      - PORT=5000
      - MONGODB_URL=mongodb://mongo:27017/learncloud
      - JWT_SECRET=learncloud_jwt_secret_key_12345
    depends_on:
      - mongo
    networks:
      - app-network

  # Backend Replica 3
  backend-3:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: learncloud-backend-3
    environment:
      - PORT=5000
      - MONGODB_URL=mongodb://mongo:27017/learncloud
      - JWT_SECRET=learncloud_jwt_secret_key_12345
    depends_on:
      - mongo
    networks:
      - app-network

  # Redis for distributed caching
  redis:
    image: redis:7-alpine
    container_name: learncloud-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: learncloud-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  nginx-cache:
  redis-data:
  mongo-data:

