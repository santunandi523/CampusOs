events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Caching zone: 10MB memory keys, up to 1GB storage on disk, inactive after 60 mins
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=API_CACHE:10m max_size=1g inactive=60m use_temp_path=off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Load Balancing Upstream Pool (Least Connections algorithm)
    upstream backend_cluster {
        least_conn;
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        server backend-3:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Disable cache for mutations and auth by default
        set $skip_cache 0;

        # Only cache GET and HEAD methods
        if ($request_method !~ ^(GET|HEAD)$) {
            set $skip_cache 1;
        }

        # Never cache authentication routes
        if ($request_uri ~* "/api/auth/.*") {
            set $skip_cache 1;
        }

        location / {
            proxy_pass http://backend_cluster;

            # Proxy & Network settings
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Failover logic across upstream nodes
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;

            # Caching Configuration
            proxy_cache API_CACHE;
            proxy_cache_bypass $skip_cache;
            proxy_no_cache $skip_cache;

            # Multi-tenant cache key including Authorization header hash
            proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";

            # Cache TTL: 200/302 responses for 5 minutes, 404 for 1 minute
            proxy_cache_valid 200 302 5m;
            proxy_cache_valid 404 1m;

            # Serve stale cache content during updates or temporary upstream outages
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            # Expose cache and load balancing headers to client for verification
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Upstream-Server $upstream_addr always;
        }
    }
}

